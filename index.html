<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- `user-scalable=no` because a two-finger pinch is a real input here (two
       thumbs on two sticks) and must not zoom the page. `viewport-fit=cover`
       plus the safe-area insets in the CSS keeps the controls clear of a
       notch and of the home indicator. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d1117" />
  <title>TANKI — prototype</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="loading">LOADING…</div>

  <!-- Pre-match loadout. The server has always accepted a per-player hull, name
       and weapon in C_HELLO and broadcast them to everyone else; the client just
       never asked, so every human joined as a Hunter called "You". The cards are
       built from config.js at runtime rather than written out here, so they
       cannot drift from the numbers the game actually uses. -->
  <div id="loadout" hidden>
    <div class="lo-panel">
      <div class="lo-title">TANKI</div>

      <label class="lo-label" for="lo-name">CALLSIGN</label>
      <input id="lo-name" maxlength="16" autocomplete="off" spellcheck="false"
             placeholder="pick a name" />

      <div class="lo-label">HULL</div>
      <div class="lo-row" id="lo-hulls"></div>

      <div class="lo-label">WEAPON</div>
      <div class="lo-row" id="lo-weapons"></div>

      <button id="lo-join">JOIN</button>
      <div class="lo-foot" id="lo-foot"></div>
    </div>
  </div>

  <!-- The match itself, top centre: who is winning, how long is left, and what
       it takes to win. All three have to be visible without opening anything —
       a score you have to press a key to see cannot change how you play. -->
  <div id="matchbar" hidden>
    <div class="mb-side" id="mb-red">
      <span class="mb-name">RED</span><b id="mb-red-score">0</b>
    </div>
    <div class="mb-mid">
      <b id="mb-clock">7:00</b>
      <span id="mb-target">FIRST TO 100</span>
    </div>
    <div class="mb-side" id="mb-blue">
      <b id="mb-blue-score">0</b><span class="mb-name">BLUE</span>
    </div>
  </div>

  <!-- Result, then a countdown to the next match. The countdown is the part
       that matters: an end screen with no stated end is indistinguishable from
       the game having crashed. -->
  <div id="matchend" hidden>
    <div class="me-title" id="me-title">RED WINS</div>
    <div class="me-score" id="me-score">0 — 0</div>
    <div class="me-next" id="me-next">NEXT MATCH IN 12</div>
  </div>

  <div id="damage"></div>

  <!-- One column down the right edge. The scoreboard grew a header row per
       team, and with the feed separately pinned to `top: 130px` the two simply
       overlapped — kill messages printed across the BLUE block. Stacking them
       in one flow means the feed sits under the board at any player count
       instead of at a guessed offset that is wrong for some of them. -->
  <div id="right-rail">
    <div id="scoreboard"></div>
    <div id="feed"></div>
  </div>
  <div id="perf"></div>

  <div id="respawn">RESPAWNING…</div>

  <div id="hud">
    <div id="left">
      <div class="bar-wrap">
        <div id="hp-fill"></div>
        <span id="hp-text">280 / 280</span>
      </div>
      <!-- One bar for "can I shoot yet". On a charge weapon it fills as the
           shot winds up; on everything else it fills as the gun reloads. Both
           answer the same question, so they share one place to look. -->
      <div id="charge"><div id="charge-fill"></div></div>
      <div id="charge-hint"></div>
      <!-- Active air-drop abilities, with the time left on each. -->
      <div id="buffs"></div>
    </div>

    <div id="center">
      <div id="weapon-block">
        <span id="weapon-name">Twin</span>
        <span id="weapon-band">CLOSE</span>
      </div>
      <div id="slots">
        <button class="slot active" data-weapon="twin"><b>1</b> Twin</button>
        <button class="slot" data-weapon="thunder"><b>2</b> Thunder</button>
        <button class="slot" data-weapon="rail"><b>3</b> Rail</button>
      </div>
    </div>

    <div id="right">
      <div class="stat"><span>KILLS</span><b id="kills">0</b></div>
    </div>
  </div>

  <div id="help">
    <b>WASD</b> drive · <b>Z X</b> turret · <b>Q E</b> camera · <b>space</b> fire · <b>1 2 3</b> weapon
    · <b>P</b> perf · <b>B</b> bloom · <b>O</b> shadows
  </div>

  <!-- Touch controls. Shown only on a coarse-pointer device (or ?touch=1). The
       zones are large invisible halves; the stick base appears under the thumb
       wherever it lands, so nothing has to be found by feel. -->
  <div id="touch" hidden>
    <div class="tc-zone" id="tc-move">
      <div class="tc-base"><div class="tc-knob"></div></div>
    </div>
    <div class="tc-zone" id="tc-aim">
      <div class="tc-base"><div class="tc-knob"></div></div>
    </div>
    <button id="tc-auto" class="tc-chip">AUTO</button>
    <button id="tc-fire">FIRE</button>
  </div>

  <div id="rotate">↻<span>TURN YOUR PHONE SIDEWAYS</span></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
